[project]
name = "tree-os"
version = "0.0.0"
description = "TREE OS: an Ubuntu-based Linux distribution with a macOS-inspired desktop."
requires-python = ">=3.12"
# Dependencies are pinned for development in requirements-dev.txt.
# No runtime packages exist yet (Sprint 001 is foundation only).
dependencies = []

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["tests", "framework/tree-config", "framework/tree-logging", "applications/finder"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["tests", "framework/tree-config", "framework/tree-logging", "applications/finder"]
mypy_path = "framework/tree-config:framework/tree-logging:applications/finder"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["framework/tree-config", "framework/tree-logging", "applications/finder"]
addopts = "-ra --strict-markers"
